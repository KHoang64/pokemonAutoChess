<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>prototype-wasd</title>
    <link rel="stylesheet" href="/hud.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: system-ui, sans-serif;
      }
      #game {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <button type="button" id="swap-btn" class="swap-open-btn">Swap Pokémon</button>
    </div>
    <div id="swap-backdrop" class="hidden"></div>
    <nav id="swap-menu" class="swap-menu hidden" aria-label="Choose Pokémon"></nav>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
